name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Run tests
        run: cargo test --all-targets
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release executable
        run: cargo build --release
      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.1.3'
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid package version from ref: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Resolve NSIS compiler
        id: nsis
        shell: pwsh
        run: |
          $candidates = [System.Collections.Generic.List[string]]::new()
          if ($env:ProgramFiles) {
            $candidates.Add((Join-Path $env:ProgramFiles 'NSIS\makensis.exe'))
          }
          if (${env:ProgramFiles(x86)}) {
            $candidates.Add((Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))
          }
          if ($env:ChocolateyInstall) {
            $candidates.Add((Join-Path $env:ChocolateyInstall 'bin\makensis.exe'))
            $candidates.Add((Join-Path $env:ChocolateyInstall 'lib\nsis\tools\makensis.exe'))
          }
          $candidates.Add('C:\ProgramData\chocolatey\bin\makensis.exe')
          $candidates.Add('C:\Program Files (x86)\NSIS\makensis.exe')
          $candidates.Add('C:\Program Files\NSIS\makensis.exe')

          $resolved = $candidates |
            Select-Object -Unique |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $resolved) {
            $searched = ($candidates -join '; ')
            throw "NSIS compiler makensis.exe was not found. Searched trusted paths: $searched"
          }

          $resolved = [System.IO.Path]::GetFullPath($resolved)
          if ([System.IO.Path]::GetFileName($resolved) -ine 'makensis.exe') {
            throw "Resolved NSIS compiler has an unexpected filename: $resolved"
          }
          "MAKENSIS=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "path=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using NSIS compiler: $resolved"
      - name: Prepare package directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null
      - name: Verify NSIS shell context scope
        shell: pwsh
        run: pwsh -File scripts\verify-nsis-scope.ps1
      - name: Build NSIS installer
        shell: pwsh
        run: '& $env:MAKENSIS "/DVERSION=$env:VERSION" installer\ShiftSpaceLangChange.nsi'
      - name: Build portable ZIP
        shell: pwsh
        run: pwsh -File scripts\build-portable.ps1 -Version $env:VERSION
      - name: Verify package outputs
        shell: pwsh
        run: pwsh -File scripts\verify-package.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: shift-space-lang-change-windows-x64
          path: |
            target/release/shift-space-lang-change.exe
            dist/ShiftSpaceLangChange-Setup-${{ steps.version.outputs.version }}-x64.exe
            dist/ShiftSpaceLangChange-Portable-${{ steps.version.outputs.version }}-x64.zip
            dist/SHA256SUMS.txt
